<!DOCTYPE html>
<html>
<head>
    <title>Guardian Live Location Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #map { height: 100vh; width: 100vw; margin: 0; }
        body { margin: 0; padding: 0; font-family: sans-serif; }
        .status-box {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: white; padding: 10px 16px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-weight: bold; color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="status-box" id="status">🚨 Connecting to Live SOS Stream...</div>
    <div id="map"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sosId = urlParams.get('id');

        // Replace with your Supabase URL & Anon Key from Supabase Dashboard -> Settings -> API
        const SUPABASE_URL = 'https://gybnqdqtcndrxzgwsrxn.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const map = L.map('map').setView([13.0827, 80.2707], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        let marker;

        if (sosId) {
            // Listen to real-time changes in the sos_logs table
            client.channel(`sos_${sosId}`)
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'sos_logs', 
                    filter: `id=eq.${sosId}` 
                }, payload => {
                    const { latitude, longitude } = payload.new;
                    if (latitude && longitude) {
                        const newPos = [latitude, longitude];
                        document.getElementById('status').innerText = '🟢 LIVE: User Location Updating';

                        if (!marker) {
                            marker = L.marker(newPos).addTo(map).bindPopup('🚨 Live User Position').openPopup();
                            map.setView(newPos, 17);
                        } else {
                            marker.setLatLng(newPos);
                            map.panTo(newPos);
                        }
                    }
                })
                .subscribe();
        } else {
            document.getElementById('status').innerText = '❌ Invalid SOS Tracking ID';
        }
    </script>
</body>
</html>
